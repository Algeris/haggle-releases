name: Build & Release to Public Repo

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: |
          npm run build
          npm run typecheck:electron
          npm run build:electron
          npm run build:native
          node scripts/ensure-sharp-mac-deps.js
          node scripts/ensure-sqlite-vec.js
          npm run verify:packaged-local-assets

      - name: Package macOS Application
        run: npx electron-builder --mac --publish never
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload macOS Release Assets to Algeris/haggle-releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          repository: Algeris/haggle-releases
          tag_name: ${{ github.ref_name }}
          token: ${{ secrets.RELEASE_TOKEN }}
          fail_on_unmatched_files: false
          files: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust (MSVC toolchain)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Dependencies
        run: npm ci

      - name: Build Renderer
        run: npm run build

      - name: Typecheck Electron
        run: npm run typecheck:electron

      - name: Build Electron Main Process
        run: npm run build:electron

      - name: Build Rust Native Module (x64 Windows)
        run: npm run build:native

      - name: Ensure SQLite-Vec Binaries
        run: node scripts/ensure-sqlite-vec.js

      - name: Package Windows Installer & Portable (.exe)
        run: npx electron-builder --win nsis portable --publish never

      - name: Upload Windows Release Assets to Algeris/haggle-releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          repository: Algeris/haggle-releases
          tag_name: ${{ github.ref_name }}
          token: ${{ secrets.RELEASE_TOKEN }}
          fail_on_unmatched_files: false
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml